name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and test
        run: make clean all CC=${{ matrix.compiler }} AR=${{ matrix.compiler == 'clang' && 'llvm-ar' || 'ar' }}

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run sanitizers
        run: make clean sanitize CC=clang AR=llvm-ar

  cross-build:
    name: Cross-build embedded targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Compile Cortex-M0, Cortex-M4, and RV32IMC objects
        run: make clean cross-build CLANG=clang

  windows:
    name: Windows host tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        run: make clean all CC=gcc AR=ar
